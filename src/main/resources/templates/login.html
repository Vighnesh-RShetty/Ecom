<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
</head>
<body>

<!-- This will call base.html and inject this section into it -->
<div th:replace="base :: layout(~{::section})">
<section>
 <div class="conatiner mt-6 p-5">
 <div class="row">
 <div class="col-md-6 p-5">
 <img src="img/ecom.png" alt="..." width="100%" height="400px">
  </div>
  <div class="col-md-4 p-5">
  <div class="card">
  <div class="card-header">
  <p class="fs-4 text-center">Login</p>
  </div>
  <div class="card-body">
  <form action="">
  <div class="mb-3">
  <label class="form-label">Email</label><input class="form-control" name="email" type="email">
  </div>
  
   <div class="mb-3">
  <label class="form-label">Password</label><input class="form-control" name="password" type="password">
  </div>
  
  <button type="submit" class="btn bg-primary text-white col-md-12">Login</button>
  </form>
  </div>
  <div class="card-footer text-center">
  <a href="#" class="text-decoration-name">Forgot Password</a><br>
 Dont have an account? <a href="/register" class="text-decoration-name">Create one</a>
  </div>
  </div>
  </div>
  </div>
  </div>
</section>
</div>
</body>
</html>
