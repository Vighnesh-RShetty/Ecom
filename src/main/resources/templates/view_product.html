<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <!-- Add Bootstrap & FontAwesome CDN if not already included -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
<!-- This will call base.html and inject this section into it -->
<div th:replace="base :: layout(~{::section})">
<section>
    <div class="container card-sh" style="margin-top:70px;margin-bottom:100px">
        <div class="row">
            <!-- Product Image -->
            <div class="col-md-6 text-end">
                <img alt="Laptop" src="img/product_img-20250424T071547Z-001/product_img/laptop.jpg" width="300px" height="400px">
            </div>

            <!-- Product Details -->
            <div class="col-md-6">
                <p class="h4">Laptop</p>
                <p>
                    <span class="fw-bold">Description :</span><br>HP Laptop, 256GB SSD
                </p>

                <p>
                    <span class="fw-bold">Product Details: </span><br>
                    Status: <span class="badge bg-success">Availabe </span> <span class="badge bg-warning">Out of Stock</span><br>
                    Category: Laptop <br>
                    Policy: 7 Days Replacement and Return
                </p>

                <p class="fs-5 fw-bold">
                    Price:&nbsp;&nbsp;
                    <i class="fas fa-indian-rupee-sign"></i> 70,000 &nbsp;
                    <span class="fs-6 text-decoration-line-through text-secondary">₹1,40,000</span>&nbsp;
                    <span class="fs-6 text-success">50% Off</span>
                </p>

                <div class="row text-center">
                    <div class="col-md-4 text-success p-2">
                        <i class="fas fa-money-bill-wave fa-2x"></i>
                        <p>Cash On Delivery</p>
                    </div>
                    <div class="col-md-4 text-danger p-2">
                        <i class="fas fa-undo fa-2x"></i>
                        <p>Return Available</p>
                    </div>
                    <div class="col-md-4 text-primary p-2">
                        <i class="fas fa-truck-moving fa-2x"></i>
                        <p>Free Delivery</p>
                    </div>
                </div>

                <a href="login.html" class="btn btn-danger w-100 mt-3 mb-5">Add To Cart</a>
            </div>
        </div>
    </div>
</section>
</div>

<!-- Optional: Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
