<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<div th:replace="base :: layout(~{::section})">
<section>
  <div class="conatiner-fluid p-5 mt-3">
    <div class="row">
     <div class="col-md-4 offset-md-4">
        <div class="card card-sh">
       <div class="card-header text-center fs-4"><p class="fw-bold">Edit Category</p>
          <th:block th:if="${session.succMsg}">
          
           <p class="text-success fw-bold">[[${session.succMsg}]]</p>
             <th:block th:text="${@commServiceImpl.removeSessionMsg()}"></th:block>
       </th:block>
       
         <th:block th:if="${session.errorMsg}">
           <p class="text-warning fw-bold">[[${session.errorMsg}]]</p>
            <th:block th:text="${@commServiceImpl.removeSessionMsg()}"></th:block>
       </th:block>
       
       </div>
         <div class="card-body">
    <form action="/admin/updateCategory" method="post" enctype="multipart/form-data">
     <input type="hidden" name="id" th:value="${category.id}">
      <div class="mb-3">
        <label>Enter Category</label>
           <input type="text" class="form-control" name="name" th:value="${category.name}">
      </div>
       <div class="mb-3">
        <label>Status</label>
        <div class="form-check">
  <input class="form-check-input" type="radio" name="isActive" id="active" value="true" th:checked="${category.isActive==true}">
  <label class="form-check-label" for="radioDefault1">
    Active
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="isActive" id="inactive" value="false" th:checked="${category.isActive==false}">
  <label class="form-check-label" for="radioDefault2">
   In Active
  </label>
</div>
      </div>
          <div class="mb-3">
        <label>Upload Image</label>
           <input type="file" class="form-control" name="file">
           </div>
           <img th:src="@{'/img/category_img/'+${category.imagePaths}}" width="50px" height="50px">
           <button class="btn btn-primary col-md-12 mt-2">Update</button>
            </form>
      </div>
      </div>
    </div>
    
   
  </div>
   
  </div>
</section>
</div>
</body>
</html>
