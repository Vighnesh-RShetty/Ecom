<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<div th:replace="base :: layout(~{::section})">
<section>
  <div class="conatiner-fluid p-5 mt-3">
    <div class="row">
     <div class="col-md-4">
        <div class="card card-sh">
       <div class="card-header text-center fs-4"><p class="fw-bold">Add Category</p>
          <th:block th:if="${session.succMsg}">
          
           <p class="text-success fw-bold">[[${session.succMsg}]]</p>
             <th:block th:text="${@commServiceImpl.removeSessionMsg()}"></th:block>
       </th:block>
       
         <th:block th:if="${session.errorMsg}">
           <p class="text-warning fw-bold">[[${session.errorMsg}]]</p>
            <th:block th:text="${@commServiceImpl.removeSessionMsg()}"></th:block>
       </th:block>
       
       </div>
         <div class="card-body">
    <form action="/admin/saveCat" method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label>Enter Category</label>
           <input type="text" class="form-control" name="name">
      </div>
       <div class="mb-3">
        <label>Status</label>
        <div class="form-check">
  <input class="form-check-input" type="radio" name="isActive" id="active" value="true" checked>
  <label class="form-check-label" for="radioDefault1">
    Active
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="isActive" id="inactive" value="false">
  <label class="form-check-label" for="radioDefault2">
   In Active
  </label>
</div>
      </div>
          <div class="mb-3">
        <label>Upload Image</label>
           <input type="file" class="form-control" name="file">
           </div>
           
           <button class="btn btn-primary col-md-12 mt-2">Save</button>
            </form>
      </div>
      </div>
    </div>
    
    <!-- Table -->
    
       <div class="col-md-8"> 
        <div class="card card-sh">
        <div class="card-header text-center fs-4">Category Details</div>
           <div class="card-body">
           
                <table class="table">
  <thead>
    <tr>
     <th scope="col">Sl.No</th>
      <th scope="col">Category</th>
       <th scope="col">Status</th>
      <th scope="col">Image</th>
      <th scope="col">Action</th>
     
    </tr>
  </thead>
  <tbody>
    <tr th:each="cat,c:${categores}">
      <th scope="row">[[${c.count}]]</th>
      <td>[[${cat.name}]]</td>
      <td>[[${cat.isActive}]]</td>
      <td><img th:src="@{'/img/category_img/'+${cat.imagePaths}}" width="50px" height="50px"></td>
      <td><a th:href="@{'/admin/editCate/'+${cat.id}}" class="btn btn-primary btn-sm"><i class="fa-solid fa-pen-to-square  fa-1x"></i>Edit</a>
      
      <a th:href="@{'/admin/deleteCate/'+${cat.id}}" class="btn btn-danger btn-sm"><i class="fa-solid fa-trash  fa-1x "></i>Delete</a>
      </td>
    </tr>
    
  </tbody>
</table>
              
             </div>
          </div>
       
       </div>
    
     </div>
  </div>

</section>
</div>
</body>
</html>
